name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests
      
    - name: Instalar pacote local no modo editável
      run: pip install -e .
        
    - name: Executar Testes (Pulando integração real se necessário)
      run: |
        pytest -m "not integration"