[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gastos-pessoais-cli"
version = "1.0.3"
description = "Gerenciador simples de gastos pessoais via CLI"
readme = "README.md"
authors = [
    { name = "Renata Teixeira", email = "renata.teixeira@sempreceub.com" }
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]
 
[project.optional-dependencies]
dev = [
    "pytest>=7.0", 
    "ruff>=0.4"
]
 
[project.scripts]
gastos = "app:main"
 
[tool.ruff]
line-length = 88
target-version = "py39"
 
[tool.ruff.lint]
select = ["E", "F", "W", "I"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que fazem requisições reais à internet (use -m 'not integration' para pular)",
    "database: testes de integração com o banco de dados"
]